limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name 8.152.4.105 8-152-4-105.nip.io;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://8.152.4.105$request_uri;
    }
}

server {
    listen 8081;
    server_name 8.152.4.105 8-152-4-105.nip.io;
    return 308 https://8.152.4.105$request_uri;
}

server {
    listen 443 ssl;
    server_name 8.152.4.105;
    ssl_certificate /etc/letsencrypt/live/tobacco-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tobacco-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html/tobacco;
    index index.html;
    client_max_body_size 20m;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;

    location = /api/register/ {
        limit_req zone=register_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/login/ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /media/ {
        alias /opt/tobacco/backend/media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
